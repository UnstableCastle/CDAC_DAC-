<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee Directory</title>
<style>
table {
	border-collapse: collapse;
	width: 100%;
	margin-top: 20px;
}

th, td {
	border: 1px solid #dddddd;
	text-align: left;
	padding: 8px;
}

th {
	background-color: #f2f2f2;
}

button a, td a {
	text-decoration: none;
	color: black;
}
button {
	padding: 6px 12px;
	cursor: pointer;
}
.action-btn {
	padding: 4px 8px;
	border: 1px solid #ccc;
	background: #f9f9f9;
	border-radius: 4px;
	margin-right: 5px;
}
.delete-btn {
	color: #cc0000 !important;
}
</style>
</head>
<body>

	<h3>Employee Table</h3>

	<button><a th:href="@{/showFormForAdd}">Add Employee</a></button>

	<table>
		<thead>
			<tr>
				<th>First Name</th>
				<th>Last Name</th>
				<th>Email</th>
				<th>Action</th> </tr>
		</thead>
		<tbody>
			<tr th:each="tempEmployee : ${employees}">
				<td th:text="${tempEmployee.firstName}">First Name Placeholder</td>
				<td th:text="${tempEmployee.lastName}">Last Name Placeholder</td>
				<td th:text="${tempEmployee.email}">Email Placeholder</td>
				
				<td>
					<a th:href="@{/showFormForUpdate(employeeId=${tempEmployee.id})}" class="action-btn">Update</a>
					
					<a th:href="@{/delete(employeeId=${tempEmployee.id})}" 
					   class="action-btn delete-btn"
					   onclick="if (!(confirm('Are you sure you want to delete this employee?'))) return false;">
					   Delete
					</a>
				</td>
			</tr>
		</tbody>
	</table>

</body>
</html>
