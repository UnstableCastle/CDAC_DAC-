<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Save Employee</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 100px; font-weight: bold; }
        input[type="text"] { padding: 5px; width: 250px; }
        button[type="submit"] { margin-left: 100px; padding: 6px 15px; cursor: pointer; }
        a { display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <h3>Employee Directory - Add/Update Employee</h3>
    <hr>

    <form th:action="@{/save}" th:object="${employee}" method="POST">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" th:field="*{firstName}" id="firstName" placeholder="Enter first name">
        </div>

        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" th:field="*{lastName}" id="lastName" placeholder="Enter last name">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" th:field="*{email}" id="email" placeholder="Enter email address">
        </div>

        <div class="form-group">
            <button type="submit">Save</button>
        </div>

    </form>

    <hr>
    <a th:href="@{/list}">Back to Employee List</a>

</body>
</html>
