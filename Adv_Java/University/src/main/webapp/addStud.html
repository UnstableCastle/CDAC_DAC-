<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Add Student</title>

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: Arial, sans-serif;
}

body {
	background: #f4f6f9;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
}

.container {
	background: white;
	padding: 30px;
	width: 400px;
	border-radius: 10px;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

h2 {
	text-align: center;
	margin-bottom: 20px;
	color: #333;
}

table {
	width: 100%;
}

td {
	padding: 10px 5px;
}

input[type="text"], input[type="password"] {
	width: 100%;
	padding: 10px;
	border: 1px solid #ccc;
	border-radius: 5px;
}

input[type="submit"] {
	width: 100%;
	padding: 12px;
	border: none;
	background: #2563eb;
	color: white;
	font-size: 16px;
	border-radius: 5px;
	cursor: pointer;
}

input[type="submit"]:hover {
	background: #1d4ed8;
}
</style>

</head>
<body>

	<div class="container">

		<h2>Add New Student</h2>

		<form action="serv3" method="post">

			<table>

				<tr>
					<td>PRN</td>
					<td><input type="text" name="txtPRN" required></td>
				</tr>

				<tr>
					<td>Name</td>
					<td><input type="text" name="txtName" required></td>
				</tr>

				<tr>
					<td>Password</td>
					<td><input type="password" name="txtPassword" required>
					</td>
				</tr>

				<tr>
					<td colspan="2"><input type="submit" value="Add Student">
					</td>
				</tr>

			</table>

		</form>

	</div>

</body>
</html>
